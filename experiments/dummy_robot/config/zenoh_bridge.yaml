# zenoh_bridge config for the dummy robot. Own device_id so it can share a zenohd with the real Husky.
/**:
  ros__parameters:
    # Device
    device_id: husky-sim-01
    mode: robot

    # Camera
    camera.offset_x: 0.0
    camera.offset_y: 0.0
    camera.offset_yaw: 0.0

    # Zenoh (zenohd on another machine: "tcp/<ip>:7447")
    zenoh.mode: client
    zenoh.connect: ["tcp/host.docker.internal:7447"]
