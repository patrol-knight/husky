# Dummy robot test stack. Run via ./launch.sh (every service has a profile, so a bare `docker compose up` starts nothing).
# zenohd comes from mission_manager.
services:
  dummy_robot:
    profiles: ["dummy_robot"]
    build:
      context: .
      dockerfile: docker/dummy_robot.Dockerfile
    environment:
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
    volumes:
      - ./config/dummy_robot.yaml:/config/dummy_robot.yaml:ro
      - ${MAP_DIR:-./maps}:/maps:ro
    restart: unless-stopped

  zenoh_bridge:
    profiles: ["zenoh_bridge"]
    build:
      context: ../../modules/zenoh_bridge
      dockerfile: docker/Dockerfile
      target: runtime
    command:
      - ros2
      - launch
      - /opt/zenoh_bridge_files/launch/bringup.launch.py
      - device_config:=/config/zenoh_bridge.yaml
    environment:
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
      - WEBRTC_ANNOUNCED_IP=${WEBRTC_ANNOUNCED_IP:-}
      - WEBRTC_ICE_PORT_MIN=${WEBRTC_ICE_PORT:-50000}
      - WEBRTC_ICE_PORT_MAX=${WEBRTC_ICE_PORT:-50000}
    volumes:
      - ./config/zenoh_bridge.yaml:/config/zenoh_bridge.yaml:ro
    # WebRTC media: one fixed UDP port, same inside and out
    ports:
      - "${WEBRTC_ICE_PORT:-50000}:${WEBRTC_ICE_PORT:-50000}/udp"
    # zenohd on this machine (local dev)
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  realsense:
    profiles: ["realsense"]
    build:
      context: .
      dockerfile: docker/realsense.Dockerfile
    # librealsense needs raw USB access
    privileged: true
    environment:
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
    volumes:
      - ../../launch:/husky/launch:ro
      - ../../config:/husky/config:ro
      - /dev/bus/usb:/dev/bus/usb
    restart: unless-stopped
