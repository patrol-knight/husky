# zenoh_bridge config for this Husky (mode: robot).
# Pose comes from aggregator_node on /robot/device_state; unset keys use zenoh_bridge's defaults.
/**:
  ros__parameters:
    # Device
    device_id: husky
    mode: robot

    # Camera (RealSense mounting offset relative to base_link)
    camera.offset_x: 0.0
    camera.offset_y: 0.0
    camera.offset_yaw: 0.0

    # Zenoh (zenohd's LAN address, e.g. tcp/192.168.1.10:7447)
    zenoh.mode: client
    zenoh.connect: ["tcp/192.168.0.40:7447"]
