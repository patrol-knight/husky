# Joystick teleop for driving the Husky with a controller plugged straight
# into the Orin (e.g. when the wireless link to the remote center is
# unreliable). Mapping verified on a real Xbox Series controller: left stick
# drives, LB (button 4) must be held to move (dead-man switch), RB
# (button 5) adds turbo. Same mapping as Clearpath's own teleop_joy config.
/**/joy_node:
  ros__parameters:
    dev: /dev/input/js0
    deadzone: 0.1
    # Keeps repeating the last input while the stick is held -- twist_mux
    # drops joy_teleop/cmd_vel after 0.5 s of silence, so this is what keeps
    # a steady stick moving the robot. Unplugging the controller stops it.
    autorepeat_rate: 20.0

/**/teleop_twist_joy_node:
  ros__parameters:
    axis_linear.x: 1
    scale_linear.x: 0.4
    scale_linear_turbo.x: 1.0
    axis_angular.yaw: 0
    scale_angular.yaw: 0.6
    scale_angular_turbo.yaw: 1.2
    enable_button: 4
    enable_turbo_button: 5
