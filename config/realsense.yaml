# Color only, matching the WebRTC stream size.
/**:
  ros__parameters:
    serial_no: ""
    rgb_camera.color_profile: "848x480x30"

    enable_color: true
    enable_depth: false

    # Skeleton detection: remove enable_depth above, then uncomment these.
    # enable_depth: true
    # depth_module.depth_profile: "848x480x30"
    # align_depth.enable: true
    # enable_sync: true
    # enable_rgbd: true

    pointcloud.enable: false
    enable_infra1: false
    enable_infra2: false
    enable_gyro: false
    enable_accel: false
